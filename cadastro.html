
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaSpace | Criar conta</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <main class="cadastro-container">

        <div class="logo">
            <span class="logo-icon">N</span>
            <span>Nova<span>Space</span></span>
        </div>

        <div class="cabecalho">
            <span class="subtitulo">JUNTE-SE A NÓS</span>
            <h1>Crie sua <span>conta.</span></h1>
            <p>Comece sua experiência no NovaSpace.</p>
        </div>

        <form id="cadastroForm">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="seuemail@gmail.com"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                minlength="6"
                required
            >

            <label for="confirmarSenha">Confirmar senha</label>
            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite sua senha novamente"
                minlength="6"
                required
            >

            <button type="submit" id="btnCadastrar">
                Criar minha conta →
            </button>

        </form>

        <p id="mensagem">Erro ao criar conta: E-mail já cadastrado.</p>

        <div class="voltar">
            Já possui uma conta?
            <a href="index.html">Entrar</a>
        </div>

        <footer>
            © 2026 NovaSpace. Todos os direitos reservados.
        </footer>

    </main>

    <script type="module" src="cadastro.js"></script>

</body>
</html>
